<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Form | Employee Payroll</title>
    <link rel="stylesheet" href="../CSS/employee-form.css">
</head>
<body>
    <header>
        <h1>Employee Form</h1>
        <nav>
            <a href="./dashboard.html">Dashboard</a>
            <a href="./employees.html">All Employees</a>
            <a href="./payrolls.html">All Payrolls</a>
            <a href="./login.html">Logout</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Add or Update Employee</h2>

            <div>
                <label for="name" class="required">Name</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div>
                <label for="email" class="required">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div>
                <label for="department" class="required">Department</label>
                <input type="text" id="department" name="department" required>
            </div>

            <div>
                <label for="designation">Designation</label>
                <input type="text" id="designation" name="designation">
            </div>

            <div>
                <label for="employeeType" class="required">Employee Type</label>
                <select id="employeeType" name="employeeType" required>
                    <option value="">Select employee type</option>
                    <option value="FULL_TIME">Full Time</option>
                    <option value="CONTRACT">Contract</option>
                </select>
            </div>

            <div>
                <label for="baseSalary" class="required">Base Salary</label>
                <input type="number" id="baseSalary" name="baseSalary" min="0" step="0.01" required>
            </div>

            <div>
                <label for="bankName">Bank Name</label>
                <input type="text" id="bankName" name="bankName">
            </div>

            <div>
                <label for="accountNumber">Account Number</label>
                <input type="text" id="accountNumber" name="accountNumber">
            </div>

            <button type="button" id="saveEmployeeButton">Save Employee</button>
            <button type="button" id="updateEmployeeButton">Update Employee</button>
            <button type="button" id="resetEmployeeButton">Reset</button>
            <p id="employeeFormMessage"></p>
        </section>
    </main>
    <script src="../JAVASCRIPT/auth.js"></script>
    <script src="../JAVASCRIPT/employee-form.js"></script>
</body>
</html>
