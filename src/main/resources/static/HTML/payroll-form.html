<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payroll Form | Employee Payroll</title>
    <link rel="stylesheet" href="../CSS/payroll-form.css">
</head>
<body>
    <header>
        <h1>Payroll Form</h1>
        <nav>
            <a href="./dashboard.html">Dashboard</a>
            <a href="./employees.html">All Employees</a>
            <a href="./payrolls.html">All Payrolls</a>
            <a href="./login.html">Logout</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Add or Update Payroll</h2>

            <div>
                <label for="payrollId">Payroll ID</label>
                <input type="number" id="payrollId" name="id">
            </div>

            <div>
                <label for="employeeId" class="required">Employee ID</label>
                <input type="number" id="employeeId" name="employeeId" required>
            </div>

            <div>
                <label for="baseSalary">Base Salary</label>
                <input type="number" id="baseSalary" name="baseSalary" min="0" step="0.01">
            </div>

            <div>
                <label for="bonus">Bonus</label>
                <input type="number" id="bonus" name="bonus" min="0" step="0.01">
            </div>

            <div>
                <label for="deductions">Deductions</label>
                <input type="number" id="deductions" name="deductions" min="0" step="0.01">
            </div>

            <div>
                <label for="totalWorkingDays" class="required">Total Working Days</label>
                <input type="number" id="totalWorkingDays" name="totalWorkingDays" min="0" required>
            </div>

            <div>
                <label for="daysPresent">Days Present</label>
                <input type="number" id="daysPresent" name="daysPresent" min="0">
            </div>

            <div>
                <label for="month" class="required">Month</label>
                <select id="month" name="month" required>
                    <option value="">Select month</option>
                    <option value="JAN">JAN</option>
                    <option value="FEB">FEB</option>
                    <option value="MAR">MAR</option>
                    <option value="APR">APR</option>
                    <option value="MAY">MAY</option>
                    <option value="JUN">JUN</option>
                    <option value="JUL">JUL</option>
                    <option value="AUG">AUG</option>
                    <option value="SEP">SEP</option>
                    <option value="OCT">OCT</option>
                    <option value="NOV">NOV</option>
                    <option value="DEC">DEC</option>
                </select>
            </div>

            <div>
                <label for="year" class="required">Year</label>
                <input type="number" id="year" name="year" min="2000" required>
            </div>

            <button type="button" id="savePayrollButton">Save Payroll</button>
            <button type="button" id="updatePayrollButton">Update Payroll</button>
            <button type="button" id="resetPayrollButton">Reset</button>
            <p id="payrollFormMessage"></p>
        </section>
    </main>
    <script src="../JAVASCRIPT/auth.js"></script>
    <script src="../JAVASCRIPT/payroll-form.js"></script>
</body>
</html>
